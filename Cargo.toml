[package]
name = "airicode"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A minimal, extensible coding-agent core"
license = "MIT"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
futures-core = "0.3"
futures-util = "0.3"
libc = "0.2"
ratatui = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
unicode-width = "0.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "airicode"
path = "src/main.rs"
